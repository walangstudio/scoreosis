name: Deploy

# Staging deploys on every push to main, production on a release tag.
# Inactive until the variable CLOUDFLARE_ACCOUNT_ID and the secret
# CLOUDFLARE_API_TOKEN are set (repository or organization); see docs/guide/cloudflare.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Only main deploys staging and only v* tags deploy production, even when run by hand.
    # The staging and production environments enforce the same refs on GitHub's side.
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' && github.repository == 'walangstudio/scoreosis' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.ref_type == 'tag' || github.event.inputs.environment != 'production')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
    env:
      TARGET: ${{ github.event.inputs.environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install lupa
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python tools/test-lua.py
      # Cloudflare refuses Durable Object Workers until the account has a workers.dev subdomain.
      - name: Register the account's workers.dev subdomain if it has none
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sf -H "$auth" "$api" > /dev/null ||
            curl -s --fail-with-body -X PUT -H "$auth" -H 'Content-Type: application/json' -d '{"subdomain":"walangstudio"}' "$api"
      - name: Create the D1 database on first deploy
        run: pnpm exec wrangler d1 info "scoreosis-$TARGET" --env "$TARGET" > /dev/null || pnpm exec wrangler d1 create "scoreosis-$TARGET"
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply "scoreosis-$TARGET" --remote --env "$TARGET"
      - name: Deploy the Worker
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ADDRESS_KEY: ${{ secrets.ADDRESS_KEY }}
        run: |
          # Ranked run starts fail closed without ADDRESS_KEY; refuse to deploy rather than ship that.
          if [ "${#ADDRESS_KEY}" -lt 32 ]; then
            echo "::error::Set the ADDRESS_KEY secret on the $TARGET environment (openssl rand -hex 32)"
            exit 1
          fi
          jq -n --arg a "$ADMIN_TOKEN" --arg k "$ADDRESS_KEY" \
            '{ADDRESS_KEY: $k} + (if $a == "" then {} else {ADMIN_TOKEN: $a} end)' > "$RUNNER_TEMP/secrets.json"
          pnpm exec wrangler deploy --env "$TARGET" --secrets-file "$RUNNER_TEMP/secrets.json"
