name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the tag is on main and matches the version and changelog
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
          v="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version package.json)" = "$v" ] || { echo "package.json is not $v"; exit 1; }
          grep -qF "## [$v]" CHANGELOG.md || { echo "CHANGELOG.md has no [$v] entry"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install lupa
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: python tools/test-lua.py
      - name: Create the GitHub release
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $pre
        env:
          GH_TOKEN: ${{ github.token }}
